<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taxi Driver</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body class="taxi-body">

    <!-- =========================
         BACK BUTTON
    ========================== -->

    <button class="back-button" onclick="history.back()">
        ← BACK
    </button>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="aboutNicole.html">About</a></li>

                <li><a href="personajes.html">Personajes</a></li>

                <li><a href="capitulos.html">Capítulos</a></li>

                <li><a href="creditos.html">Créditos</a></li>

            </ul>

        </nav>

    </header>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="taxi-main">

        <!-- =========================
             BACKGROUND
        ========================== -->

        <img
            class="taxi-background"
            src="ASSETS/Imagenes/taxidriver wallpaper.jpg"
            alt="New York"
        >

        <!-- OVERLAY -->

        <div class="taxi-overlay"></div>

        <!-- =========================
             TITLE
        ========================== -->

        <h1 class="taxi-title">
            TAXI DRIVER
        </h1>

        <!-- =========================
             RADIO
        ========================== -->

        <section class="radio-container">

            <div class="radio-box">

                <h2 class="radio-title">
                    RADIO TRAVIS BICKLE
                </h2>

                <!-- SPOTIFY -->

                <iframe

                    style="border-radius:12px"

                    src="https://open.spotify.com/embed/playlist/31YXwKz7UBqGE1maqVKLev?utm_source=generator&autoplay=1"

                    width="100%"

                    height="152"

                    frameborder="0"

                    allowfullscreen=""

                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

                    loading="lazy">

                </iframe>

            </div>

        </section>

        <!-- =========================
             SIDE BUTTONS
        ========================== -->

        <div class="taxi-side-buttons">

            <!-- EASTER EGGS -->

            <a href="taxidriver-eastereggs.html">

                <button class="taxi-side-button taxi-left">

                    🚕

                </button>

            </a>

            <!-- PLAYLIST -->

            <a href="travis-bickle.html">

                <button class="taxi-side-button taxi-right">

                    🎧

                </button>

            </a>

        </div>

        <!-- =========================
             DESCRIPTION
        ========================== -->

        <p class="taxi-text">

            Travis te ofrece recorrer la ciudad esta noche.

            Las calles están vacías,
            las luces tiemblan sobre el asfalto mojado
            y Nueva York parece esconder algo
            detrás de cada esquina.

            ¿Quieres acompañarlo?

        </p>

        <!-- =========================
             OPTIONS
        ========================== -->

        <div class="taxi-buttons">

            <!-- YES -->

            <a href="taxi-ride.html">

                <button class="taxi-button">

                    Sí, vamos

                </button>

            </a>

            <!-- NO -->

            <a href="atrapada-ny.html">

                <button class="taxi-button">

                    Mejor no

                </button>

            </a>

        </div>

    </main>

</html>
