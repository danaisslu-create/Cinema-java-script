<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Buenos Aires · El secreto de sus ojos</title>
    <link rel="stylesheet" href="secreto-radio.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- BOTONES FLOTANTES -->
    <div class="nav-buttons">
        <button class="nav-btn back-btn" onclick="history.back()">← Back</button>
        <a href="index.html" class="nav-btn home-btn">🏠 Home</a>
        <a href="secreto-easter-eggs.html" class="nav-btn easter-btn">🥚 Easter Eggs</a>
    </div>

    <!-- LLUVIA Y OVERLAY -->
    <canvas id="rainCanvas"></canvas>
    <div class="secreto-overlay"></div>

    <!-- CONTENEDOR RADIO -->
    <main class="radio-container">
        <div class="radio-card">
            <div class="radio-header">
                <div class="radio-header-line"></div>
                <h1 class="radio-title">🎙️ RADIO BUENOS AIRES</h1>
                <div class="radio-header-line"></div>
            </div>
            <p class="radio-subtitle">“Tango, memorias y la banda sonora de tu obsesión”</p>

            <!-- REPRODUCTOR DE SPOTIFY CON TU PLAYLIST PERSONALIZADA -->
            <div class="spotify-embed-container">
                <iframe 
                    id="spotifyPlayer"
                    style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/5TIXqJSrDPKwnNKzQsIAAQ?utm_source=generator" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>

            <!-- CONTROLES RADIO -->
            <div class="radio-controls">
                <div class="radio-dial">
                    <div class="dial-knob"></div>
                </div>
                <button id="activateRadioBtn" class="radio-button">
                    📻 ACTIVAR RADIO
                </button>
                <div class="radio-signal" id="radioSignal">
                    <span class="signal-wave"></span>
                    <span class="signal-wave"></span>
                    <span class="signal-wave"></span>
                </div>
            </div>

            <!-- NOW PLAYING -->
            <div class="radio-now-playing">
                <span class="now-label">✦ AHORA SUENA ✦</span>
                <span class="now-track" id="nowPlayingTrack">Preparando sintonía...</span>
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="radio-flash"></div>
    <audio id="clickSound" src="ASSETS/Audios/secreto-click.mp3"></audio>

    <script src="secreto-radio.js"></script>
</body>
</html>
