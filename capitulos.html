<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulos - Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            /* Gradiente complementario azul profundo (como el anterior) */
            background: linear-gradient(135deg, #12270f 0%, #432036 50%, #41642c 100%);
            position: relative;
            padding: 30px 20px 80px;
        }

        /* BOTÓN BACK (estilo créditos) */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid #c0a86a;
            color: #f0e6d0;
            font-family: 'Italiana', serif;
            font-size: 18px;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            z-index: 110;
            transition: 0.2s;
        }
        .back-button:hover {
            background: #c0a86a;
            color: #0a0c10;
            transform: translateX(-3px);
        }

        /* NAVBAR (estilo créditos) */
        header {
            position: sticky;
            top: 15px;
            z-index: 100;
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }
        nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            list-style: none;
            background: rgba(30,30,35,0.5);
            backdrop-filter: blur(12px);
            padding: 12px 30px;
            border-radius: 80px;
            border: 1px solid rgba(192,168,106,0.4);
        }
        nav ul li a {
            text-decoration: none;
            font-family: 'Italiana', serif;
            color: #fef7e0;
            font-size: 18px;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        nav ul li a:hover {
            color: #d4c2a5;
            text-shadow: 0 0 4px #fffaec;
        }

        /* CONTENEDOR PRINCIPAL */
        .capitulos-page {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        /* TÍTULO */
        .capitulos-title {
            font-family: 'DM Serif Display', serif;
            font-size: 70px;
            text-align: center;
            color: #f2e4c0;
            letter-spacing: 4px;
            margin-bottom: 60px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
        }

        /* CONTENEDOR DE TARJETAS: todas en una línea (flex sin wrap en desktop) */
        .capitulos-container {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 40px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        /* Cada ítem: flip card + botón externo */
        .ciudad-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 220px; /* ancho fijo para todos */
            flex-shrink: 0;
        }

        /* FLIP CARD CIRCULAR */
        .flip-card {
            background-color: transparent;
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }
        .flip-card:hover .flip-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            overflow: hidden;
        }
        .flip-front {
            background: #1e1e1e;
        }
        .flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .flip-back {
            background: linear-gradient(145deg, #2c2a27, #1b1916);
            color: #f0e6d0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border: 1px solid #c0a86a;
            text-align: center;
        }
        .flip-back p {
            font-family: 'Italiana', serif;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        /* BOTÓN EXTERNO (estilo consistente) */
        .ciudad-button {
            background: #c0a86a;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-family: 'Italiana', serif;
            font-size: 18px;
            color: #1a1a1a;
            cursor: pointer;
            transition: 0.2s;
            width: auto;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .ciudad-button:hover {
            background: #e0c88a;
            transform: scale(1.02);
        }

        /* Responsive: si la pantalla es muy pequeña, permitir scroll horizontal */
        @media (max-width: 1000px) {
            .capitulos-container {
                justify-content: flex-start;
            }
        }
        @media (max-width: 700px) {
            .capitulos-title {
                font-size: 48px;
            }
            .flip-card {
                width: 160px;
                height: 160px;
            }
            .ciudad-item {
                width: 180px;
            }
            nav ul {
                gap: 12px;
                padding: 8px 18px;
            }
            nav ul li a {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- BOTÓN BACK -->
    <button class="back-button" onclick="history.back()">←</button>

    <!-- NAVBAR -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutNicole.html">About</a></li>
                <li><a href="personajes.html">Personajes</a></li>
                <li><a href="capitulos.html">Capítulos</a></li>
                <li><a href="creditos.html">Créditos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="capitulos-page">
            <h1 class="capitulos-title">CAPÍTULOS</h1>
            <div class="capitulos-container">

                <!-- Bogotá -->
                <div class="ciudad-item">
                    <div class="flip-card">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <img src="ASSETS/Imagenes/BOGOTA SKY.jpg" alt="Bogotá">

                            <div class="flip-back">
                                <p>🌿 Monserrate · Café · La Séptima</p>
                            </div>
                        </div>
                    </div>
                    <a href="Capitulo1-bogota.html">
                        <button class="ciudad-button">Bogotá</button>
                    </a>
                </div>

                <!-- New York -->
                <div class="ciudad-item">
                    <div class="flip-card">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <img src="ASSETS/Imagenes/NYC SKY.jpg" alt="New York">
                            </div>
                            <div class="flip-back">
                                <p>🗽 Runway · Moda · Decisiones</p>
                            </div>
                        </div>
                    </div>
                    <a href="devil-wears-prada.html">
                        <button class="ciudad-button">New York</button>
                    </a>
                </div>

                <!-- Buenos Aires -->
                <div class="ciudad-item">
                    <div class="flip-card">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <img src="ASSETS/Imagenes/buenos aires.jpg" alt="Buenos Aires">
                            </div>
                            <div class="flip-back">
                                <p>🇦🇷 Tango · Investigación · Medianeras</p>
                            </div>
                        </div>
                    </div>
                    <a href="Medianeras.html">
                        <button class="ciudad-button">Buenos Aires</button>
                    </a>
                </div>

                <!-- Londres -->
                <div class="ciudad-item">
                    <div class="flip-card">
                        <div class="flip-inner">
                            <div class="flip-front">
                                <img src="ASSETS/Imagenes/london sky.jpg" alt="Londres">
                            </div>
                            <div class="flip-back">
                                <p>🇬🇧 Paddington · James Bond · Explora</p>
                            </div>
                        </div>
                    </div>
                    <a href="capitulo-paddington.html">
                        <button class="ciudad-button">Londres</button>
                    </a>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
