<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bond Chase</title>

    <link rel="stylesheet" href="jamesBond.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&display=swap" rel="stylesheet">

</head>

<body class="bond-chase-body">

    <!-- BACK BUTTON -->
    <button class="bond-chase-back-button" onclick="history.back()">←</button>

    <!-- BACKGROUND BASE -->
    <img
        src="ASSETS/Imagenes/ruinass.jpeg"
        class="bond-chase-background"
        alt="Chaos"
    >

    <!-- RUINS GLOW LAYER (CLICKABLE) -->
    <a href="james-bond3.html" class="ruins-link">
        <img
            src="ASSETS/Imagenes/ruinas pt2.png"
            class="bond-chase-ruins-glow"
            alt="Ruins Glow"
        >
    </a>

    <!-- TITLE -->
    <h1 class="bond-chase-title">RUN</h1>

    <!-- MAIN TEXT -->
    <main class="bond-chase-container">

        <section class="bond-chase-dialogue-box">

            <p class="bond-chase-dialogue">“Lograste salir.”</p>

            <p class="bond-chase-dialogue-small">
                La calle es un caos.<br><br>
                Sirenas, humo y disparos.<br><br>
                Hay una persecución.<br><br>
                Tienes que esconderte.
            </p>

        </section>

    </main>

    <!-- ASTON MARTIN -->
    <img
        src="ASSETS/Imagenes/carrito.png"
        class="bond-aston"
        id="bondAston"
        alt="Aston Martin"
    >

    <!-- AUDIO -->
    <audio id="bondChaseAudio" autoplay>
    <source src="ASSETS/Audios/EFECTOS DE SONIDO COCHE DERRAPAR GEMIDO DERRAPE.mp3" type="audio/mpeg">
</audio>

<div class="music-box">

    <button id="musicToggle">▶ Play</button>

    <audio id="bondMusic">
        <source src="ASSETS/Audios/no time to die.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const music = document.getElementById("bondMusic");
const btn = document.getElementById("musicToggle");

let isPlaying = false;

btn.addEventListener("click", () => {

    if (!isPlaying) {

        music.play();
        btn.textContent = "⏸ Pause";
        isPlaying = true;

    } else {

        music.pause();
        btn.textContent = "▶ Play";
        isPlaying = false;
    }

});

</script>
</body>

<script>

const aston = document.getElementById("bondAston");

window.addEventListener("load", () => {
    setTimeout(() => {
        aston.classList.add("bond-aston-move");
    }, 700);
});

</script>
