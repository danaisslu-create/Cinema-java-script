<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bogotá - Perro come Perro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="bogota.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&display=swap" rel="stylesheet">

</head>

<body class="bogota-body">
<!-- =========================
     BACK BUTTON
========================= -->

<button
    class="bogota-back-button"
    onclick="history.back()"
>

    ←

</button>
    <!-- =========================
         BACKGROUND
    ========================== -->

    <img
        src="ASSETS/Imagenes/bogota-rain.jpg"
        class="bogota-background"
        alt="Bogotá"
    >

    <div class="bogota-overlay"></div>

    <!-- =========================
         RAIN LAYER
    ========================== -->

    <div class="rain-layer"></div>

    <!-- =========================
         TITLE
    ========================== -->

    <h1 class="bogota-title">

        BOGOTÁ

    </h1>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="bogota-container">

        <!-- TEXT BOX -->

        <section class="bogota-dialogue-box">

            <p class="bogota-dialogue">

                “La lluvia ya paró, pero el piso sigue mojado. .”

            </p>

            <p class="bogota-dialogue-small">

               Caminas por la Séptima mientras los buses pasan haciendo ruido y la gente sigue de largo sin mirar mucho.
                Al fondo ves el mercado de pulgas.
                Sin saber por qué, terminas entrando.


            </p>

        </section>

        <!-- CONTINUE BUTTON -->

        <div class="bogota-button-container">

            <button
                class="bogota-button"
                onclick="irMercado()"
            >

                Continuar caminando

            </button>

        </div>

    </main>

    <!-- =========================
         BUS ANIMATION
    ========================== -->

    <img
        src="ASSETS/Imagenes/sitp.png"
        class="bogota-bus"
        id="bogotaBus"
        alt="Bus Bogotá"
    >

    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="bogotaAudio"
        loop
    >

        <source
            src="ASSETS/Audios/bogota-ambience.mp3"
            type="audio/mpeg"
        >

    </audio>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
