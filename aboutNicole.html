<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Nicole</title>
    <link rel="icon" href="ASSETS/Imagenes/nicole.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }

        body {
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            /* GRADIENTE VERDE (puedes cambiar los colores) */
            background: linear-gradient(135deg, #3c1a2a 0%, #5a2a51 50%, #7a3d63 100%);
            position: relative;
            overflow-x: hidden;
            padding: 20px 20px 60px;
        }

        /* Efecto de textura vegetal sutil */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,200,0.1) 1px, transparent 1px);
            background-size: 35px 35px;
            pointer-events: none;
            z-index: 0;
        }

        /* BOTÓN BACK */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,240,0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,200,0.5);
            padding: 8px 20px;
            border-radius: 40px;
            font-family: 'Italiana', serif;
            font-size: 18px;
            color: #f9f2e0;
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
        }

        .back-button:hover {
            background: #c4a27a;
            color: #1e2a1a;
            transform: translateX(-3px);
            border-color: transparent;
        }

        /* NAVBAR */
        header {
            position: sticky;
            top: 15px;
            z-index: 50;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }
        nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            list-style: none;
            background: rgba(30,30,25,0.5);
            backdrop-filter: blur(12px);
            padding: 12px 30px;
            border-radius: 80px;
            border: 1px solid rgba(255,245,210,0.3);
        }
        nav ul li a {
            text-decoration: none;
            font-family: 'Italiana', serif;
            color: #fef7e0;
            font-size: 18px;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        nav ul li a:hover {
            color: #d4c2a5;
            text-shadow: 0 0 4px #fffaec;
        }

        /* CONTENEDOR PRINCIPAL */
        .travis-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* TÍTULO */
        .travis-title {
            font-family: 'DM Serif Display', serif;
            font-size: 64px;
            color: #fef3da;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            text-align: center;
        }

        /* FOTO PRINCIPAL DE NICOLE (circular, elegante) */
        .travis-image:first-of-type {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #e9d6b0;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .travis-image:first-of-type:hover {
            transform: scale(1.02);
            border-color: #ffefc0;
        }

        /* SECCIONES (cada "ciudad" es como una tarjeta) */
        .ciudad {
            background: rgba(30,35,25,0.55);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 30px 25px;
            text-align: center;
            width: 100%;
            max-width: 550px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(235,215,160,0.4);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }
        .ciudad:hover {
            transform: translateY(-6px);
            background: rgba(40,50,35,0.7);
            border-color: #ecd9a8;
            box-shadow: 0 18px 28px rgba(0,0,0,0.3);
        }

        .travis-description {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: #fff3df;
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 2px solid #e9d6b0;
            display: inline-block;
            padding-bottom: 6px;
        }

        /* IMÁGENES DE LAS SECCIONES (cuadradas, redondeadas) */
        .ciudad .travis-image {
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            margin-bottom: 20px;
            transition: 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .ciudad .travis-image:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 20px rgba(0,0,0,0.25);
        }

        /* BOTÓN DENTRO DE LA ÚLTIMA SECCIÓN (Empezar la historia) */
        .ciudad button {
            background: #e9d6b0;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-family: 'Italiana', serif;
            font-size: 20px;
            color: #1e2a1a;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            font-weight: bold;
        }
        .ciudad button:hover {
            background: #ffefc4;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .travis-title {
                font-size: 44px;
            }
            .ciudad {
                padding: 20px;
            }
            .travis-description {
                font-size: 24px;
            }
            nav ul {
                gap: 12px;
                padding: 8px 18px;
            }
            nav ul li a {
                font-size: 14px;
            }
            .back-button {
                font-size: 14px;
                padding: 5px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- BOTÓN BACK -->
    <button class="back-button" onclick="history.back()">← BACK</button>

    <!-- NAVBAR -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutNicole.html">About</a></li>
                <li><a href="personajes.html">Personajes</a></li>
                <li><a href="capitulos.html">Capítulos</a></li>
                <li><a href="creditos.html">Créditos</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENIDO -->
    <main class="travis-container">
        <h1 class="travis-title">About Nicole</h1>

        <!-- FOTO PRINCIPAL -->
        <img src="ASSETS/Imagenes/nicole.png" alt="Nicole" class="travis-image">

        <!-- SPOTIFY -->
        <section class="ciudad">
            <h2 class="travis-description">🎧 Escucha el Spotify de Nicole</h2>
            <a href="spotify.html">
                <img src="ASSETS/Imagenes/spotifynicole.png" alt="Spotify Nicole" class="travis-image">
            </a>
        </section>

        <!-- INDISPENSABLES -->
        <section class="ciudad">
            <h2 class="travis-description">📦 Los indispensables de Nicole</h2>
            <a href="indispensables.html">
                <img src="ASSETS/Imagenes/indispensables.jpeg" alt="Indispensables" class="travis-image">
            </a>
        </section>

        <!-- ROOM TOUR -->
        <section class="ciudad">
            <h2 class="travis-description">🏠 Room Tour</h2>
            <a href="roomtour.html">
                <img src="ASSETS/Imagenes/roomtour.jpeg" alt="Room Tour" class="travis-image">
            </a>
        </section>

        <!-- CONOCE BOGOTÁ -->
        <section class="ciudad">
            <h2 class="travis-description">🌆 Conoce Bogotá</h2>
            <a href="conocebogota.html">
                <img src="ASSETS/Imagenes/bogota.jpeg" alt="Bogotá" class="travis-image">
            </a>
            <a href="conocebogota.html">
                <button>✨ Empezar la Historia ✨</button>
            </a>
        </section>
    </main>
</body>
</html>
