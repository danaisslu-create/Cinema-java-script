<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>James Bond Intro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="jamesBond.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&display=swap" rel="stylesheet">

</head>

<body class="bond-body">

    <!-- =========================
         BACK BUTTON
    ========================== -->

    <button
        class="bond-back-button"
        onclick="history.back()"
    >

        ←

    </button>

    <div class="nav-buttons">
        <a href="index.html" class="nav-btn home-btn">🏠 Home</a>
    </div>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <img
        src="ASSETS/Imagenes/Burning inside pm house.jpeg"
        class="bond-background"
        alt="Destroyed London"
    >

    <div class="bond-overlay"></div>

    <!-- =========================
         FIRE / SMOKE EFFECT
    ========================== -->

    <div class="bond-fire-layer"></div>

    <!-- =========================
         TITLE
    ========================== -->

    <h1 class="bond-title">

        LONDON

    </h1>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="bond-container">

        <!-- DIALOGUE BOX -->

        <section class="bond-dialogue-box">

            <p class="bond-dialogue">

                “Huele a humo.”

            </p>

            <p class="bond-dialogue-small">

                El edificio está destruido.
                No recuerdas cómo llegaste ahí.

                <br><br>

                Las alarmas siguen sonando a lo lejos,
                y las cenizas caen lentamente sobre Londres.

                <br><br>

                Dios mío…
                tienes que salir de aquí.

            </p>

        </section>

        <!-- BUTTON -->

        <div class="bond-button-container">

            <button
                class="bond-button"
                onclick="window.location.href='james-bond2.html'"
            >

                ESCAPA

            </button>

        </div>

    </main>

    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="bondAudio"
        loop
    >

        <source
            src="ASSETS/Audios/flamitas.mp3"
            type="audio/mpeg"
        >

    </audio>

    <!-- =========================
         JAVASCRIPT PARA EL AUDIO
    ========================== -->

    <script>
        // Espera a que toda la página se cargue
        document.addEventListener('DOMContentLoaded', function() {
            
            // Selecciona el audio
            var audio = document.getElementById('bondAudio');
            
            // Ajusta el volumen (opcional: entre 0 y 1)
            audio.volume = 0.5;
            
            // Intenta reproducir automáticamente
            var playPromise = audio.play();
            
            // Si el navegador bloquea el autoplay...
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("Autoplay bloqueado. Esperando que el usuario haga click...");
                    
                    // Al hacer click en CUALQUIER parte de la página, reproduce el audio
                    function playAudioOnInteraction() {
                        audio.play();
                        // Remueve los event listeners después de que empiece a sonar
                        document.body.removeEventListener('click', playAudioOnInteraction);
                        document.body.removeEventListener('keydown', playAudioOnInteraction);
                        document.body.removeEventListener('touchstart', playAudioOnInteraction);
                    }
                    
                    // Escucha diferentes tipos de interacción
                    document.body.addEventListener('click', playAudioOnInteraction);
                    document.body.addEventListener('keydown', playAudioOnInteraction);
                    document.body.addEventListener('touchstart', playAudioOnInteraction);
                });
            }
        });
    </script>

</body>

</html>
