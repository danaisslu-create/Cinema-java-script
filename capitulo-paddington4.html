    <!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Museum Page</title>

    <style>
        /* =========================
           MUSEUM SCROLL GIF
        ========================= */

        .museum-scroll-gif-section{

            display:flex;

            justify-content:center;

            align-items:center;

            margin-top:-300px;    /* Separación desde arriba */

            margin-bottom:100px;
        }

        /* =========================
           GIF (con animación aplicada)
        ========================= */

        .museum-scroll-gif{

            width:320px;

            opacity:0.85;

            /* Animación al GIF */
            animation: museumFlotarGif 2.5s ease-in-out infinite;
        }

        /* =========================
           FLOAT ANIMATION
        ========================= */

        @keyframes museumFlotarGif {

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-5px);  /* Sube solo 5px */
            }

            100%{
                transform:translateY(0px);
            }    
        }

        /* =========================
           OTROS ESTILOS (mantengo los tuyos)
        ========================= */

        .museum-page {
            background-color: #f5f0e8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .back-button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }

        .album-section {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .album-image {
            max-width: 100%;
            height: auto;
        }

        .museum-text-top {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>

</head>



</html>
    <!-- TEXTO 1 -->
    <div class="museum-text-top" style="font-size: 35px;">
        Qué día tan ocupado tuvieron.  
        Abre tu maleta para guardar las cosas.
    </div>

    <!-- MALETA -->
    <div class="suitcase-section">
        <img 
            src="ASSETS/Imagenes/maleta cerrada.png"
            class="suitcase-image"
            id="suitcase"
        >
    </div>
    
<!-- SCROLL DOWN GIF -->

<section class="museum-scroll-gif-section">

    <img 
        src="ASSETS/Imagenes/scroll dowm.png"
        class="museum-scroll-gif"
        alt="scroll down gif"
    >

</section>

<style>

/* =========================
   MUSEUM SCROLL GIF SECTION
========================= */

.museum-scroll-gif-section{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-top:-20px;

    margin-bottom:40px;
}

/* =========================
   MUSEUM SCROLL GIF
========================= */

.museum-scroll-gif{

    width:320px;

    opacity:0.85;

    animation:museumFlotarGif 2.5s ease-in-out infinite;
}

/* =========================
   FLOAT ANIMATION
========================= */

@keyframes museumFlotarGif {

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0px);
    }

}

</style>
    <!-- TEXTO 2 -->
    <div class="museum-text-bottom" id="museumText">
        Oh wow, ¿qué es eso?  
        Todavía tienes un tiquete para el museo.  
        ¿Por qué no vas con Paddington?
    </div>

    <!-- BOTÓN -->
    <div class="museum-button-container" id="museumButton">

        <a href="capitulo-paddington5.html">
            <button class="museum-button">
                Vamos al museo
            </button>
        </a>

    </div>

    <!-- JS -->
   <script>
const suitcase = document.getElementById("suitcase");
const museumText = document.getElementById("museumText");
const museumButton = document.getElementById("museumButton");

suitcase.addEventListener("click", function(){

    suitcase.src = "ASSETS/Imagenes/foto maleta.png";

    suitcase.classList.add("open");
    museumText.classList.add("show-content");
    museumButton.classList.add("show-content");

});

</script>

</body>
</html>
