<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medianeras · El departamento</title>
    <link rel="stylesheet" href="medianeras.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="nav-buttons">
        <button class="nav-btn back-btn" onclick="history.back()">← Back</button>
        <a href="index.html" class="nav-btn home-btn">🏠 Home</a>
        <a href="secreto-easter-eggs.html" class="nav-btn easter-btn">🥚 Easter Eggs</a>
        <a href="secreto-radio.html" class="nav-btn radio-btn">🎵 Radio</a>
    </div>

    <canvas id="rainCanvas"></canvas>
    <div class="medianeras-overlay"></div>

    <main class="medianeras-container">
        <div class="medianeras-card">
            <h2>🎨 El departamento de Mariana</h2>
            <p class="dialogo">"Mira esto — dice Mariana, señalando una maqueta de la ciudad—. Cada edificio es una isla. Pero a veces las islas se conectan."</p>
            <div class="objetos-grid">
                <div class="objeto" data-objeto="maqueta">🏙️ Maqueta</div>
                <div class="objeto" data-objeto="ventana">🪟 Ventana</div>
                <div class="objeto" data-objeto="balcon">🚪 Balcón</div>
            </div>
            <button id="terrazaBtn" class="continue-btn">⬆️ Subir a la terraza</button>
        </div>
    </main>

    <div id="objetoPopup" class="popup-overlay" style="display:none;">
        <div class="popup-container">
            <button class="popup-close">✕</button>
            <h2 id="popupTitulo"></h2>
            <p id="popupDescripcion"></p>
        </div>
    </div>

    <div id="medianeras-flash"></div>
    <audio id="clickSound" src="ASSETS/Audios/secreto-click.mp3"></audio>

    <script src="medianeras-departamento.js"></script>
</body>
</html>
