<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travis Bickle Playlist</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="playlist-body">

    <!-- =========================
         BACK BUTTON
    ========================== -->

    <button class="back-button" onclick="history.back()">
        ← 
    </button>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <img
        src="ASSETS/Imagenes/taxidriver wallpaper.jpg"
        class="playlist-background"
        alt="Taxi Driver Background"
    >

    <div class="playlist-overlay"></div>

    <!-- =========================
         TITLE
    ========================== -->

    <h1 class="playlist-title">
        RADIO TRAVIS BICKLE
    </h1>

    <!-- =========================
         RADIO PLAYER
    ========================== -->

    <main class="playlist-container">

        <section class="playlist-radio-box">

            <!-- RADIO SCREEN -->

            <div class="playlist-radio-screen">

                NIGHT RIDE FM

            </div>

            <!-- SPOTIFY -->

            <iframe

                class="playlist-spotify"

                src="https://open.spotify.com/embed/playlist/31YXwKz7UBqGE1maqVKLev?utm_source=generator&autoplay=1"

                width="100%"

                height="352"

                frameborder="0"

                allowfullscreen=""

                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

                loading="lazy">

            </iframe>

            <!-- QUOTE -->

            <p class="playlist-quote">

                “All the animals come out at night.”  
                Nueva York nunca duerme. Travis tampoco.

            </p>

            <!-- DETAILS -->

            <div class="playlist-details">

                <span>🌧 Manhattan, 1976</span>

                <span>🚕 Taxi #405</span>

                <span>🕓 2:13 AM</span>

            </div>

        </section>

    </main>

    <!-- =========================
         EASTER EGGS BUTTON
    ========================== -->

    <div class="playlist-bottom-button">

        <a href="taxidriver-eastereggs.html">

            <button class="playlist-side-button">

                🚕 Ver Easter Eggs

            </button>

        </a>

    </div>

</body>

</html>
