<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hide Scene</title>

<link rel="stylesheet" href="jamesBond.css">

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&display=swap" rel="stylesheet">

</head>

<body class="scene-body">

<!-- BACK BUTTON -->
<button class="back-button" onclick="history.back()">←</button>

<!-- BACKGROUND -->
<img src="ASSETS/Imagenes/fondo 3.jpeg" class="scene-bg">

<!-- BACKGROUND -->
<img src="ASSETS/Imagenes/fondo 3.jpeg" class="scene-bg">

<!-- BULLETS -->

<div class="bullet bullet1"></div>
<div class="bullet bullet2"></div>
<div class="bullet bullet3"></div>
<div class="bullet bullet4"></div>
<div class="bullet bullet5"></div>

<!-- TITLE -->
<h1 class="scene-title">ESCAPA</h1>

<!-- TEXT -->
<main class="scene-container">

<section class="scene-box">

<p>
“Estás escondida.”
</p>

<p>
Las balas siguen cayendo.<br><br>
Necesitas algo rápido.<br><br>
Abres tu maleta.
</p>

</section>

<!-- SKYFALL PLAYER -->

<div class="skyfall-player">

    <button id="skyfallBtn">

        ▶ PLAY SKYFALL

    </button>

    <audio id="skyfallAudio">

        <source
            src="ASSETS/Audios/skyfall.mp3"
            type="audio/mpeg"
        >

    </audio>

</div>

<script>

const skyfallBtn = document.getElementById("skyfallBtn");
const skyfallAudio = document.getElementById("skyfallAudio");

let isPlaying = false;

skyfallBtn.addEventListener("click", () => {

    if(!isPlaying){

        skyfallAudio.play();

        skyfallBtn.innerHTML = "❚❚ PAUSE SKYFALL";

        isPlaying = true;

    } else {

        skyfallAudio.pause();

        skyfallBtn.innerHTML = "▶ PLAY SKYFALL";

        isPlaying = false;
    }

});

</script>

</main>

<!-- SUITCASE -->
 
<img
    src="ASSETS/Imagenes/maleta james.png"
    class="suitcase"
    id="suitcase"
>
<!-- INVENTORY -->
<div class="inventory" id="inventory">

    <div class="inventory-box">

        <div class="bag-container">

            <img
                src="ASSETS/Imagenes/pop up James.jpeg"
                class="bag-base"
            >

            <!-- CLICKABLE OBJECT -->
            <a href="james-bond4.html">

                <img
                    src="ASSETS/Imagenes/camara1.png"
                    class="bag-glow"
                >

            </a>

        </div>

    </div>

</div>

<!-- =========================
     BOND WARNING
========================= -->

<div class="bond-warning">

    <img
        src="ASSETS/Imagenes/papi bond.png"
        class="bond-warning-img"
    >

    <div class="bond-warning-text">

        "Tienes que huir.<br>
        No es seguro aquí."

    </div>

</div>
<!-- AUDIO -->
<audio id="gunAudio" autoplay>

    <source
        src="ASSETS/Audios/balas.mp3"
        type="audio/mpeg"
    >

</audio>

<script>

const suitcase = document.getElementById("suitcase");
const inventory = document.getElementById("inventory");
const gunAudio = document.getElementById("gunAudio");

suitcase.addEventListener("click", () => {

    inventory.style.display = "flex";

    gunAudio.play();

});

</script>

</body>
</html>
