<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justicia · El secreto de sus ojos</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* =========================
           RESET Y BASE
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto Condensed', sans-serif;
            background: #0a0c10;
            position: relative;
        }

        /* LLUVIA (canvas) */
        #rainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .secreto-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10,12,16,0.5) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* BOTONES NAVEGACIÓN */
        .nav-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(20,20,25,0.85);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            color: #f0e6d0;
            font-family: 'Italiana', serif;
            font-size: 16px;
            text-decoration: none;
            border: 1px solid rgba(200,180,120,0.4);
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #8b6b3d;
            color: white;
            transform: translateY(-2px);
        }

        .back-btn {
            background: rgba(139,107,61,0.7);
        }

        /* HEADER */
        .secreto-header {
            text-align: center;
            padding-top: 80px;
            position: relative;
            z-index: 10;
        }

        .secreto-title {
            color: #e6d5b8;
            font-size: 65px;
            font-family: 'DM Serif Display', serif;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .secreto-subtitle {
            color: #b8a77c;
            font-size: 20px;
            font-family: 'Italiana', serif;
            margin-top: 15px;
        }

        /* CONTENEDOR INVESTIGACIÓN */
        .investigacion-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .expediente {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 30px;
            border-left: 8px solid #8b6b3d;
        }

        .expediente-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border-bottom: 1px solid #8b6b3d;
            padding-bottom: 15px;
        }

        .expediente-header h2 {
            font-family: 'DM Serif Display', serif;
            color: #e6d5b8;
            font-size: 28px;
        }

        .folder-icon {
            font-size: 32px;
            margin-right: 10px;
        }

        .fecha {
            color: #b8a77c;
            font-style: italic;
        }

        /* Grid de pistas */
        .pistas-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 30px 0;
        }

        .pista-card {
            background: rgba(30,30,35,0.8);
            border-radius: 24px;
            padding: 25px 20px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(200,180,120,0.3);
        }

        .pista-card:hover {
            transform: translateY(-8px);
            background: rgba(50,45,35,0.9);
            border-color: #8b6b3d;
            box-shadow: 0 0 20px rgba(139,107,61,0.4);
        }

        .pista-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .pista-card h3 {
            color: #e6d5b8;
            font-family: 'Italiana', serif;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .pista-card p {
            color: #b8a77c;
            font-size: 14px;
        }

        /* Botón resolver */
        .investigacion-actions {
            text-align: center;
            margin-top: 40px;
        }

        .action-btn {
            background: #8b6b3d;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 22px;
            font-family: 'Italiana', serif;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #a88454;
            transform: scale(1.02);
        }

        /* POPUP */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .popup-container {
            background: #1e1e1e;
            max-width: 550px;
            width: 90%;
            border-radius: 32px;
            padding: 30px;
            position: relative;
            border-top: 6px solid #8b6b3d;
            text-align: center;
            max-height: 85vh;
            overflow-y: auto;
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #8b6b3d;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .popup-container h2 {
            font-family: 'DM Serif Display', serif;
            color: #e6d5b8;
            margin-bottom: 15px;
        }

        .popup-imagen {
            width: 100%;
            max-height: 250px;
            object-fit: contain;  /* Para que la imagen no se recorte */
            border-radius: 20px;
            margin: 15px 0;
            background: #0a0c10;
        }

        .popup-container p {
            color: #ddd;
            font-size: 18px;
            line-height: 1.5;
        }

        /* Flash */
        #justicia-flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 10001;
        }

        .flash-active {
            animation: flashAnim 0.4s linear;
        }

        @keyframes flashAnim {
            0% { opacity: 0; }
            30% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        @media (max-width: 700px) {
            .secreto-title { font-size: 45px; }
            .pista-card { width: 160px; padding: 15px; }
            .expediente-header h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="nav-buttons">
        <button class="nav-btn back-btn" onclick="history.back()">← Back</button>
        <a href="index.html" class="nav-btn home-btn">🏠 Home</a>
        <a href="secreto-easter-eggs.html" class="nav-btn easter-btn">🥚 Easter Eggs</a>
        <a href="secreto-radio.html" class="nav-btn radio-btn">🎵 Radio</a>
    </div>

    <canvas id="rainCanvas"></canvas>
    <div class="secreto-overlay"></div>

    <header class="secreto-header">
        <h1 class="secreto-title">JUSTICIA</h1>
        <p class="secreto-subtitle">“El expediente está sobre la mesa. Investiga cada pista.”</p>
    </header>

    <main class="investigacion-container">
        <div class="expediente">
            <div class="expediente-header">
                <span class="folder-icon">📁</span>
                <h2>Caso: MORALES, Liliana</h2>
                <span class="fecha">1999 · Buenos Aires</span>
            </div>
            <div class="pistas-grid">
                <div class="pista-card" data-pista="ficha">
                    <div class="pista-icon">📄</div>
                    <h3>Ficha policial</h3>
                    <p>Haz clic para leer</p>
                </div>
                <div class="pista-card" data-pista="testimonio">
                    <div class="pista-icon">🗣️</div>
                    <h3>Testimonio</h3>
                    <p>Declaración clave</p>
                </div>
                <div class="pista-card" data-pista="foto">
                    <div class="pista-icon">🖼️</div>
                    <h3>Fotografía</h3>
                    <p>Evidencia visual</p>
                </div>
                <div class="pista-card" data-pista="carta">
                    <div class="pista-icon">✉️</div>
                    <h3>Carta anónima</h3>
                    <p>Una pista inesperada</p>
                </div>
            </div>
        </div>

        <div class="investigacion-actions">
            <button id="resolverBtn" class="action-btn">🔍 Resolver el caso</button>
        </div>
    </main>

    <div id="justicia-flash"></div>
    <audio id="typewriterSound" src="ASSETS/Audios/typewriter.mp3"></audio>
    <audio id="paperSound" src="ASSETS/Audios/paper-flip.mp3"></audio>
    <audio id="clickSound" src="ASSETS/Audios/secreto-click.mp3"></audio>

    <!-- Popup oculto -->
    <div id="pistaPopup" class="popup-overlay" style="display:none;">
        <div class="popup-container">
            <button class="popup-close">✕</button>
            <h2 id="popupTitulo"></h2>
            <img id="popupImagen" class="popup-imagen" src="" alt="Pista">
            <p id="popupDescripcion"></p>
        </div>
    </div>

    <script>
        // =========================
        // 1. LLUVIA CON CANVAS
        // =========================
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const drops = [];
        const DROP_COUNT = 180;
        for (let i = 0; i < DROP_COUNT; i++) {
            drops.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: 4 + Math.random() * 12,
                length: 8 + Math.random() * 14,
                opacity: 0.3 + Math.random() * 0.5
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            for (let drop of drops) {
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x, drop.y + drop.length);
                ctx.strokeStyle = `rgba(200, 220, 255, ${drop.opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function updateRain() {
            for (let drop of drops) {
                drop.y += drop.speed;
                if (drop.y > height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * width;
                }
            }
        }

        function animateRain() {
            updateRain();
            drawRain();
            requestAnimationFrame(animateRain);
        }
        animateRain();

        // =========================
        // 2. DATOS DE LAS PISTAS (con imágenes reales o placeholder)
        // =========================
        const pistasData = {
            ficha: {
                titulo: "📄 Ficha policial",
                img: "ASSETS/Imagenes/ficha-policial.jpg",
                desc: "Liliana Morales fue atacada el 21 de junio de 1999. No hay testigos. El único sospechoso fue liberado por falta de pruebas."
            },
            testimonio: {
                titulo: "🗣️ Testimonio de Benjamín Esposito",
                img: "ASSETS/Imagenes/testimonio.jpg",
                desc: "“Vi algo en sus ojos. El odio no se borra. Pasaron 25 años y todavía lo recuerdo.”"
            },
            foto: {
                titulo: "🖼️ Fotografía de la escena",
                img: "ASSETS/Imagenes/escena-crimen.jpg",
                desc: "Una foto borrosa de la estación de tren. Alguien escribió detrás: 'TE AMO'."
            },
            carta: {
                titulo: "✉️ Carta anónima",
                img: "ASSETS/Imagenes/carta-anonima.jpg",
                desc: "“Pregunta en el estadio. Ahí está la verdad.”"
            }
        };

        // =========================
        // 3. POPUPS Y SONIDOS
        // =========================
        const popup = document.getElementById('pistaPopup');
        const popupTitulo = document.getElementById('popupTitulo');
        const popupImagen = document.getElementById('popupImagen');
        const popupDesc = document.getElementById('popupDescripcion');
        const closeBtn = document.querySelector('.popup-close');
        const typewriter = document.getElementById('typewriterSound');
        const paperSound = document.getElementById('paperSound');
        const clickSound = document.getElementById('clickSound');
        const flashDiv = document.getElementById('justicia-flash');

        function activarFlash() {
            if (clickSound) {
                clickSound.currentTime = 0;
                clickSound.play().catch(e => console.log);
            }
            flashDiv.classList.remove('flash-active');
            void flashDiv.offsetWidth;
            flashDiv.classList.add('flash-active');
        }

        function mostrarPopup(pistaId) {
            const data = pistasData[pistaId];
            if (!data) return;
            popupTitulo.innerText = data.titulo;
            popupImagen.src = data.img;
            popupDesc.innerText = data.desc;
            popup.style.display = 'flex';
            activarFlash();
            // Sonidos temáticos
            if (typewriter) {
                typewriter.currentTime = 0;
                typewriter.play().catch(e=>console.log);
            }
            if (paperSound) {
                paperSound.currentTime = 0;
                paperSound.play().catch(e=>console.log);
            }
        }

        function cerrarPopup() {
            popup.style.display = 'none';
        }
        closeBtn.addEventListener('click', cerrarPopup);
        window.addEventListener('click', (e) => {
            if (e.target === popup) cerrarPopup();
        });

        // Asignar eventos a las tarjetas
        const pistasCards = document.querySelectorAll('.pista-card');
        pistasCards.forEach(card => {
            card.addEventListener('click', () => {
                const pistaId = card.dataset.pista;
                mostrarPopup(pistaId);
            });
        });

        // =========================
        // 4. BOTÓN RESOLVER
        // =========================
        const resolverBtn = document.getElementById('resolverBtn');
        resolverBtn.addEventListener('click', () => {
            activarFlash();
            setTimeout(() => {
                window.location.href = "secreto-estadio.html";
            }, 400);
        });
    </script>
</body>
</html>
