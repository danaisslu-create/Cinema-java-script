<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justicia · El secreto de sus ojos</title>
    <link rel="stylesheet" href="secreto-justicia.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Italiana&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="nav-buttons">
        <button class="nav-btn back-btn" onclick="history.back()">← Back</button>
        <a href="index.html" class="nav-btn home-btn">🏠 Home</a>
        <a href="secreto-easter-eggs.html" class="nav-btn easter-btn">🥚 Easter Eggs</a>
        <a href="secreto-radio.html" class="nav-btn radio-btn">🎵 Radio</a>
    </div>

    <canvas id="rainCanvas"></canvas>
    <div class="secreto-overlay"></div>

    <header class="secreto-header">
        <h1 class="secreto-title">JUSTICIA</h1>
        <p class="secreto-subtitle">“El expediente está sobre la mesa. Investiga cada pista.”</p>
    </header>

    <main class="investigacion-container">
        <div class="expediente">
            <div class="expediente-header">
                <span class="folder-icon">📁</span>
                <h2>Caso: MORALES, Liliana</h2>
                <span class="fecha">1999 · Buenos Aires</span>
            </div>
            <div class="pistas-grid">
                <div class="pista-card" data-pista="ficha">
                    <div class="pista-icon">📄</div>
                    <h3>Ficha policial</h3>
                    <p>Haz clic para leer</p>
                </div>
                <div class="pista-card" data-pista="testimonio">
                    <div class="pista-icon">🗣️</div>
                    <h3>Testimonio</h3>
                    <p>Declaración clave</p>
                </div>
                <div class="pista-card" data-pista="foto">
                    <div class="pista-icon">🖼️</div>
                    <h3>Fotografía</h3>
                    <p>Evidencia visual</p>
                </div>
                <div class="pista-card" data-pista="carta">
                    <div class="pista-icon">✉️</div>
                    <h3>Carta anónima</h3>
                    <p>Una pista inesperada</p>
                </div>
            </div>
        </div>

        <div class="investigacion-actions">
            <button id="resolverBtn" class="action-btn">🔍 Resolver el caso</button>
        </div>
    </main>

    <div id="justicia-flash"></div>
    <audio id="typewriterSound" src="ASSETS/Audios/typewriter.mp3"></audio>
    <audio id="paperSound" src="ASSETS/Audios/paper-flip.mp3"></audio>
    <audio id="clickSound" src="ASSETS/Audios/secreto-click.mp3"></audio>

    <!-- Popup oculto -->
    <div id="pistaPopup" class="popup-overlay" style="display:none;">
        <div class="popup-container">
            <button class="popup-close">✕</button>
            <h2 id="popupTitulo"></h2>
            <img id="popupImagen" class="popup-imagen" src="" alt="Pista">
            <p id="popupDescripcion"></p>
        </div>
    </div>

    <script src="secreto.js"></script>
</body>
</html>
